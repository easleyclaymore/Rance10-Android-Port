name: Rance10 CI

# Dedicated CI for the Rance10 fork. Upstream's Flatpak/Windows jobs are
# intentionally not used here: the target is a native arm64 Android build,
# and the intermediate Linux build only has to stay compilable plus pass
# the Core Layer portability gate.
on:
  push:
    branches: [main, rance10-native]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability-gate:
    name: Core Layer portability gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No Linux-only headers / no hardcoded paths in Core Layer
        run: python3 tools/check_core_deps.py

  linux-build:
    name: Linux ${{ matrix.arch }} ${{ matrix.buildtype }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            buildtype: debug
            experimental: false
          - runner: ubuntu-24.04-arm
            arch: aarch64
            buildtype: debug
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build flex bison \
            libsdl2-dev libfreetype-dev libffi-dev libpng-dev \
            libsndfile1-dev libturbojpeg0-dev libwebp-dev zlib1g-dev \
            libgl-dev libglew-dev libcglm-dev libdeflate-dev

      - name: Configure
        run: meson setup build -Dbuildtype=${{ matrix.buildtype }} -Dopengles=disabled

      - name: Build
        run: ninja -C build

      - name: Inspect artifact
        run: |
          file build/src/xsystem4
          ls -lh build/src/xsystem4
          ./build/src/xsystem4 --help 2>&1 | head -8 || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xsystem4-linux-${{ matrix.arch }}-${{ matrix.buildtype }}
          path: build/src/xsystem4
          if-no-files-found: error
