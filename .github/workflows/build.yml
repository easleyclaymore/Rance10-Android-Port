name: Build & Release

# 目标：每次 push 都验证「能编译」，打 tag（v*）时把 **二进制** 发到 GitHub Releases。
#
# 刻意不做的：
#   - 不产出 .deb / AppImage / Flatpak —— 项目还在早期，发行版打包会立刻变成
#     维护负担，而且这时候用户真正需要的只是「一个能跑起来的可执行文件」。
#   - 不做 Android APK（还没到那一步，见 Release 说明）。
#
# 两个坑写在这里，免得下次再踩：
#   1. 兰斯10 这个 fork 用的是 **SDL3**，而 ubuntu-24.04 的源里没有 libsdl3-dev，
#      所以下面先试 apt、失败就自己编 SDL3。
#   2. `subprojects/libsys4` 是 gitlink（上游 nunuhara/libsys4 的 e2bf438），
#      但本仓库对它有 4 个文件的本地补丁（gsave v8 / ajp_get_metrics）。
#      拉下来之后必须按 README「获取源码」那节应用 `patches/000{1,2}-*.patch`，
#      否则 xsystem4 会在链接期找不到 `ajp_get_metrics`。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sdl3_version:
        description: 'Force an SDL3 version (e.g. 3.2.28). Empty = auto-detect.'
        required: false
        default: ''

permissions:
  contents: write

env:
  SDL3_VERSION_OVERRIDE: ${{ github.event.inputs.sdl3_version }}

jobs:
  portability-gate:
    name: Core Layer portability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply local libsys4 patches
        run: |
          git -C subprojects/libsys4 apply -v \
            "$GITHUB_WORKSPACE/patches/0001-libsys4-gsave-v8.patch" \
            "$GITHUB_WORKSPACE/patches/0002-libsys4-ajp-metrics.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No Linux-only headers / no hardcoded paths in Core Layer
        # 文档 / 手册两项依赖开发工作区（父目录 AGENTS.md、游戏目录里的官方手册），
        # CI 里永远不成立；跳过它们，只跑代码可移植性 + 补丁落地检查。
        env:
          XSYS4_SKIP_DOC_GATE: '1'
        run: python3 tools/check_core_deps.py

  build:
    name: Build linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # 不要 fetch-tags / fetch-depth: 0：
      #   · depth=0 实测在 checkout 阶段卡了 9 分钟不动（仓库只有 34MB，不是体积问题）；
      #   · fetch-tags 与「tag 事件」冲突，checkout 会报
      #     `Cannot fetch both <sha> and refs/tags/<tag>`（run 44709488788 就这么红的）。
      # tag 触发时 checkout 本来就取的是 tag ref，`git describe` 够用；
      # 拿不到也只是 `--version` 打 unknown，不影响功能。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply local libsys4 patches
        run: |
          git -C subprojects/libsys4 apply -v \
            "$GITHUB_WORKSPACE/patches/0001-libsys4-gsave-v8.patch" \
            "$GITHUB_WORKSPACE/patches/0002-libsys4-ajp-metrics.patch"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build cmake flex bison \
            libfreetype-dev libffi-dev libpng-dev libsndfile1-dev \
            libturbojpeg0-dev libwebp-dev zlib1g-dev libdeflate-dev \
            libgl-dev libglew-dev libcglm-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
          # SDL3 在 24.04 的源里通常没有；有就省事，没有就走下面的源码构建。
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libsdl3-dev || true

      - name: Build SDL3 from source (only if missing)
        run: |
          if pkg-config --exists sdl3; then
            echo "system SDL3: $(pkg-config --modversion sdl3)"
            exit 0
          fi
          echo "cmake: $(cmake --version | head -1)"

          # 默认钉在 3.2.x（LTS 线，各发行版打包的那条），不跟 latest ——
          # 一是 3.4.x 对 CMake 版本要求更高（24.04 自带 3.28 可能不够），
          # 二是「用户机器上装的是 3.2」时，用 3.2 构建出来的兼容性更稳。
          # 需要换版本就重跑 workflow_dispatch 并填 sdl3_version。
          VER="$SDL3_VERSION_OVERRIDE"
          if [ -z "$VER" ]; then
            VER=$(curl -fsSL 'https://api.github.com/repos/libsdl-org/SDL/releases?per_page=30' \
                  | grep -o '"tag_name": *"release-3\.2\.[0-9]*"' \
                  | head -1 | sed -E 's/.*release-([0-9.]+).*/\1/')
          fi
          [ -n "$VER" ] || VER="3.2.28"
          echo "building SDL3 $VER"

          dump() {
            echo "== $1 failed, last lines: =="
            tail -60 "$2" 2>/dev/null | while IFS= read -r l; do
              echo "::error::$l"
              echo "$l"
            done
          }

          curl -fsSL -o sdl3.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${VER}/SDL3-${VER}.tar.gz" \
            || { echo "::error::SDL3 ${VER} tarball download failed"; exit 1; }
          tar xf sdl3.tar.gz
          cd "SDL3-${VER}"

          # CI 跑在无显示的 runner 上，不需要 Wayland；关掉能少一堆系统依赖。
          if ! cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF \
              -DSDL_WAYLAND=OFF -DSDL_WERROR=OFF > /tmp/sdl-cfg.log 2>&1; then
            dump "cmake configure" /tmp/sdl-cfg.log
            exit 1
          fi
          if ! cmake --build build > /tmp/sdl-build.log 2>&1; then
            dump "cmake build" /tmp/sdl-build.log
            exit 1
          fi
          sudo cmake --install build
          sudo ldconfig

      - name: Configure
        run: |
          # 刚装到 /usr/local，显式把 pkg-config 路径指过去，别指望默认搜索路径。
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "sdl3: $(pkg-config --modversion sdl3 2>&1)"
          if ! meson setup build --buildtype=release -Dopengles=disabled > /tmp/meson.log 2>&1; then
            echo "== meson setup failed =="
            # GitHub 每个 step 只保留 10 条 annotation，所以要挑，不能整段 tail。
            grep -inE "error|not found|could not|no such|failed|missing|unmet" /tmp/meson.log \
              | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            echo "---- full log tail ----"
            tail -40 /tmp/meson.log
            exit 1
          fi
          tail -20 /tmp/meson.log

      - name: Build
        run: |
          if ! ninja -C build > /tmp/ninja.log 2>&1; then
            echo "== ninja failed =="
            grep -E "error|Error|FAILED" /tmp/ninja.log | head -40 | while IFS= read -r l; do
              echo "::error::$l"
            done
            tail -60 /tmp/ninja.log
            exit 1
          fi

      - name: Smoke test (binary starts and exits cleanly)
        run: |
          file build/src/xsystem4
          ls -lh build/src/xsystem4
          # --version 是受支持的参数，打印后就退出；仍然 unset DISPLAY，
          # 避免任何情况下真的去起窗口（runner 没有显示服务）。
          env -u DISPLAY -u WAYLAND_DISPLAY ./build/src/xsystem4 --version
          # CI 只能证明「二进制能启动并正常退出」—— 有功能断言的冒烟需要游戏数据
          # （标题 → 第一章 → 任务简报 → 回合开始 → 战斗），在本地或有数据的机器上跑：
          #     tools/run/smoke.sh quick   # 约 100 秒
          #     tools/run/smoke.sh full    # 约 11 分钟
          # 两者都用日志断言 + 退出码给结论，不看截图。

      - name: Package
        id: pkg
        run: |
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          VER="${{ github.ref_name }}"
          case "$VER" in
            v*) ;;
            *)  VER="v0.0.0-$(echo "${GITHUB_SHA}" | cut -c1-7)" ;;
          esac
          ARCH=$(uname -m)
          NAME="xsystem4-${VER}-linux-${ARCH}"
          mkdir -p "dist/${NAME}/lib"
          strip --strip-unneeded build/src/xsystem4
          cp build/src/xsystem4 "dist/${NAME}/"
          cp .github/run.sh "dist/${NAME}/run.sh"
          chmod +x "dist/${NAME}/run.sh"
          cp .github/README-RUN.txt "dist/${NAME}/"
          if [ -f LICENSE ]; then cp LICENSE "dist/${NAME}/"; fi
          # 系统源里通常没有 SDL3，把构建时用的那份一起带走，
          # 由 run.sh 通过 LD_LIBRARY_PATH 优先加载。
          SDL_LIBDIR=$(pkg-config --variable=libdir sdl3)
          cp -a "${SDL_LIBDIR}"/libSDL3.so* "dist/${NAME}/lib/"
          # GLEW 的 soname 各发行版不一样（Debian/Ubuntu 是 2.2，Arch 是 2.1），
          # 不带上就会出现「在别人机器上 error while loading shared libraries」。
          cp -a /usr/lib/x86_64-linux-gnu/libGLEW.so* "dist/${NAME}/lib/" 2>/dev/null || true
          ls -l "dist/${NAME}/lib/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Verify package runs standalone
        run: |
          cd dist && tar xzf ./*.tar.gz && cd ..
          env -u DISPLAY -u WAYLAND_DISPLAY ./dist/xsystem4-*/run.sh --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist/
          # 带 `-` 的 tag 视为预览版（v0.1.0-preview.1 这种），打上 prerelease 标记，
          # 免得在 Releases 首页被当成「正式可用版本」。
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --title "xsystem4（兰斯10 fork）${TAG} — Linux x86_64 预览版" \
            --notes-file .github/release-notes.md \
            --verify-tag $PRE
